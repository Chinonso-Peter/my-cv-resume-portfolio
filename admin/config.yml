backend:
  name: github
  repo: Chinonso-Peter/my-cv-resume-portfolio
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth

# Enables local testing with `npx decap-server`
local_backend: true

media_folder: "assets/images"
public_folder: "assets/images"

display_url: "https://chinonso-peter.github.io/my-cv-resume-portfolio"
logo_url: "https://chinonso-peter.github.io/my-cv-resume-portfolio/assets/images/portrait.jpg"

collections:
  - name: "portfolio"
    label: "Portfolio Settings & Content"
    delete: false
    editor:
      preview: false
    files:
      - name: "profile_settings"
        label: "Profile & Identity"
        file: "data/portfolio.json"
        fields:
          - label: "Profile Information"
            name: "profile"
            widget: "object"
            fields:
              - { label: "Brand Name", name: "brand_name", widget: "string", default: "EZEA.DEV" }
              - { label: "Brand Subtitle", name: "brand_sub", widget: "string", default: "DEV.SEC" }
              - { label: "Full Name", name: "name", widget: "string", default: "Ezea Chinonso Peter" }
              - { label: "Eyebrow (Role)", name: "eyebrow_role", widget: "string", default: "SOFTWARE & GAME DEVELOPER" }
              - { label: "Eyebrow (Security)", name: "eyebrow_sec", widget: "string", default: "CYBERSECURITY PRACTITIONER" }
              - { label: "Hero Headline", name: "headline", widget: "string" }
              - { label: "Bio Summary", name: "bio", widget: "text" }
              - { label: "Portrait Photo", name: "portrait", widget: "image", default: "assets/images/portrait.jpg" }
              - { label: "Status Banner", name: "status", widget: "string", default: "AVAILABLE FOR ROLES & CONTRACTS" }
              - { label: "Current Year", name: "year", widget: "string", default: "2026" }
              - { label: "Email Address", name: "email", widget: "string" }
              - { label: "Location", name: "location", widget: "string", default: "Lagos, Nigeria" }
              - label: "Social Links"
                name: "social"
                widget: "object"
                fields:
                  - { label: "GitHub URL", name: "github", widget: "string" }
                  - { label: "LinkedIn URL", name: "linkedin", widget: "string" }
                  - { label: "itch.io (Studio)", name: "itch_vecna", widget: "string" }
                  - { label: "itch.io (Personal)", name: "itch_personal", widget: "string" }

          - label: "Technical Skills Matrix"
            name: "skills"
            widget: "object"
            fields:
              - { label: "Cybersecurity & Pentesting Skills", name: "cybersecurity", widget: "list" }
              - { label: "Software & Web Development Skills", name: "software", widget: "list" }
              - { label: "Game Dev & Tools Skills", name: "game_dev", widget: "list" }

          - label: "Featured Projects"
            name: "projects"
            widget: "list"
            fields:
              - { label: "Project Identifier (e.g. PROJ_01)", name: "id", widget: "string" }
              - { label: "Project Title", name: "title", widget: "string" }
              - { label: "Filter Category (game, sec, soft, or 'sec soft')", name: "category", widget: "string" }
              - { label: "Badge Label", name: "badge", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Tags", name: "tags", widget: "list" }
              - { label: "Live Demo URL", name: "live_url", widget: "string" }
              - { label: "Live Button Label", name: "live_label", widget: "string", default: "Live Demo" }
              - { label: "Repository / Studio URL", name: "github_url", widget: "string" }
              - { label: "Repo Button Label", name: "github_label", widget: "string", default: "GitHub" }

          - label: "Experience & Trajectory"
            name: "experience"
            widget: "list"
            fields:
              - { label: "Role / Position", name: "role", widget: "string" }
              - { label: "Company / Organization", name: "company", widget: "string" }
              - { label: "Headline Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Role Tag", name: "role_tag", widget: "string" }
              - { label: "Tech Tag", name: "tech_tag", widget: "string" }
